apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ${github_repo_url}
    targetRevision: lesson-fp
    path: charts/django-app # folder containing Chart.yaml
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: django
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
